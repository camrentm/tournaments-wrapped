name: Build & Release

on:
  push:
    tags:
      - "v*"          # triggers on tags like v1.0, v1.2.3
  workflow_dispatch:  # lets you trigger it manually from GitHub too

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # 3.11 is stable & well-supported by PyInstaller

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "StartGG-Stats" --add-data "ui;ui" app.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: StartGG-Stats-Windows
          path: dist/StartGG-Stats.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          body: |
            ## start.gg Tournament Stats ${{ github.ref_name }}

            ### Download
            - **Windows:** Download `StartGG-Stats.exe` below and double-click to run.

            > First launch: Windows may show a SmartScreen warning.
            > Click **"More info" → "Run anyway"** to proceed.

            ### What's new
            See commit history for changes in this release.
          files: dist/StartGG-Stats.exe
          draft: false
          prerelease: false
